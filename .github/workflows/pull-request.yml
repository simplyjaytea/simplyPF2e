name: Pull Request Checks

# Main auto-releases after verification, but contributors need the same signal
# before merge. Keep this read-only: it validates the proposed tree and cannot
# create tags, releases, or repository content.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify module
        run: node tools/check.mjs

      - name: Validate patch formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
